name: Trigger-All-Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read
  actions: read

jobs:
  Ruijie_RG_X60-NEW:
    uses: ./.github/workflows/Ruijie_RG_X60-NEW.yml
    with:
      CONFIG_FILE: configs/ruijie-rg-x60-new.config
      FIRMWARE_TAG: Ruijie_RG_X60-NEW
    permissions:
      contents: write
      actions: write
