# SPDX-License-Identifier: MIT
# OpenWrt MediaTek Builder - MT798x cloud firmware build workflow
#
# 构建骨架参考 VIKINGYFY/OpenWRT-CI 的编译流程:
#   Checkout -> 环境初始化 -> 变量初始化 -> 克隆源码 -> 脚本检查
#   -> 缓存恢复 -> feeds -> 定制 -> 下载 -> 编译 -> 打包发布
#
# 定制步骤 (Custom Settings) 执行本仓库 diy-script.sh:
#   完整保留个人化编译逻辑(主机名/IP/密码/主题/插件源/补丁),不做配置拼接。
# 环境准备依赖 sbwml/actions 官方复合动作:
#   free-disk(磁盘合并挂载 /builder) / openwrt-build-setup / install-llvm

name: Build releases

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Select the build device'
        required: true
        default: 'ruijie-rg-x60-new'
        type: choice
        options:
          - 'cmcc-xr30-nand'
          - 'cudy-tr3000-v1'
          - 'h3c-magic-nx30-pro'
          - 'xiaomi-mi-router-ax3000t'
          - 'xiaomi-mi-router-wr30u'
          - 'clx-s20p'
          - 'xiaomi-redmi-router-ax6000'
          - 'netcore-n60-pro'
          - 'ruijie-rg-x60-new'
      ccache:
        description: 'Enable ccache cache'
        required: false
        default: true
        type: boolean

env:
  # ---- 源码与构建配置 ----
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: configs/${{ github.event.inputs.device }}.config
  DIY_SCRIPT: diy-script.sh
  # ---- 缓存 ----
  CACHE_TOOLCHAIN: true
  CCACHE_KEY_PREFIX: openwrt-25.12-${{ github.event.inputs.device }}-ccache
  # ---- 发布 ----
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: ${{ github.event.inputs.device }}
  TZ: Asia/Shanghai
  # ---- 构建时通过 $GITHUB_ENV 动态写入,此处声明默认值以消除
  #      "Context access might be invalid" 静态检查警告 ----
  OPENWRT_PATH: ''
  SOURCE_REPO: ''
  DEVICE_TARGET: ''
  DEVICE_SUBTARGET: ''
  FIRMWARE_PATH: ''
  KERNEL: ''
  WRT_HASH: ''
  DATE: ''
  FILE_DATE: ''
  COMMIT_AUTHOR: ''
  COMMIT_DATE: ''
  COMMIT_MESSAGE: ''
  COMMIT_HASH: ''

jobs:
  Build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write
      actions: write

    steps:
    # ---------------------------------------------------------------
    # 源码与仓库文件(先行获取,后续步骤依赖仓库内脚本与配置)
    # ---------------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    - name: Show system
      run: |
        echo -e "\n\e[1;32mCPU:\e[0m"
        echo "$(grep 'model name' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}') ($(grep 'cpu MHz' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}')MHz) x $(grep processor /proc/cpuinfo  | wc -l)"
        echo -e "\n\e[1;32mMemory:\e[0m"
        free -h
        echo -e "\n\e[1;32mStorage:\e[0m"
        df -Th / /mnt
        echo -e "\n\e[1;32mSystem:\e[0m"
        lsb_release -a
        echo -e "\n\e[1;32mKernel:\e[0m"
        uname -a
        echo

    # ---------------------------------------------------------------
    # 环境初始化
    # ---------------------------------------------------------------
    # 合并 / 与 /mnt 空闲空间并挂载到 /builder,须在源码克隆前执行
    - name: Free disk space
      uses: sbwml/actions@free-disk
      with:
        build-mount-path: /builder

    - name: Build System Setup
      uses: sbwml/actions@openwrt-build-setup

    - name: Install LLVM
      uses: sbwml/actions@install-llvm

    - name: Set Timezone
      run: sudo timedatectl set-timezone "$TZ"

    # ---------------------------------------------------------------
    # 变量初始化
    # ---------------------------------------------------------------
    - name: Initialization Values
      run: |
        echo "SOURCE_REPO=$(echo $REPO_URL | awk -F '/' '{print $(NF)}')" >> $GITHUB_ENV
        echo "Building $REPO_URL ($REPO_BRANCH) for device: ${{ github.event.inputs.device }}"

    # ---------------------------------------------------------------
    # 克隆源码
    # ---------------------------------------------------------------
    - name: Clone Code
      run: |
        df -hT /builder
        git clone $REPO_URL -b $REPO_BRANCH /builder/openwrt
        cd /builder/openwrt && rm -rf files
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
        COMMIT_AUTHOR=$(git show -s --date=short --format="作者: %an")
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        COMMIT_DATE=$(git show -s --date=short --format="时间: %ci")
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        COMMIT_MESSAGE=$(git show -s --date=short --format="内容: %s")
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        COMMIT_HASH=$(git show -s --date=short --format="hash: %H")
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

    - name: Check Scripts
      run: |
        # 赋予自定义脚本执行权限(仓库文件均以 LF 保存,无需 dos2unix)
        find $GITHUB_WORKSPACE -maxdepth 2 -type f -name "*.sh" -exec chmod +x {} \;
        echo "scripts permission set"

    # ---------------------------------------------------------------
    # 缓存恢复
    # key 精确到源码 commit,restore-keys 回退到同设备最近缓存
    # ---------------------------------------------------------------
    - name: Restore Cached
      id: restore-cache
      if: ${{ github.event.inputs.ccache == 'true' }}
      uses: actions/cache/restore@main
      with:
        path: /builder/.ccache
        key: ${{ env.CCACHE_KEY_PREFIX }}-${{ env.WRT_HASH }}
        restore-keys: |
          ${{ env.CCACHE_KEY_PREFIX }}-

    # 未精确命中时删除同设备旧缓存条目,避免累积占满 10GB 配额
    - name: Cleanup Stale Caches
      if: ${{ github.event.inputs.ccache == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --key "${{ env.CCACHE_KEY_PREFIX }}-" --limit 100 | cut -f 1 | xargs -r -n 1 gh cache delete
        echo "stale caches cleaned"

    # ---------------------------------------------------------------
    # feeds 更新
    # ---------------------------------------------------------------
    - name: Update Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ---------------------------------------------------------------
    # 配置与定制
    # ---------------------------------------------------------------
    - name: Generate Variables
      run: |
        # 防御性检查:设备配置文件必须存在
        [ -f "$CONFIG_FILE" ] || {
          echo "::error::Config file not found: $CONFIG_FILE"
          exit 1
        }
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig > /dev/null 2>&1
        echo "DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD .config | awk -F '\"' '{print $2}')" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET .config | awk -F '\"' '{print $2}')" >> $GITHUB_ENV

    - name: Cache Toolchain
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    # 执行本仓库 diy-script.sh:个人化编译步骤(主机名/IP/密码/插件源/补丁等),
    # 末尾自带 feeds update/install,克隆的新插件源随即生效。
    - name: Custom Settings
      run: |
        [ -e files ] && mv files $OPENWRT_PATH/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        $GITHUB_WORKSPACE/$DIY_SCRIPT
#        $GITHUB_WORKSPACE/scripts/preset-terminal-tools.sh

    # ---------------------------------------------------------------
    # 下载与编译
    # ---------------------------------------------------------------
    - name: Download Packages
      run: |
        cd $OPENWRT_PATH
        make defconfig
        make download -j$(nproc) || make download -j1
        # 删除下载失败的 0 字节/损坏文件
        find dl -size -1024c -exec rm -f {} +

    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        # 内存感知并行度:每核预留 1.5GB 内存,避免 Runner OOM
        MEM_GB=$(free -g | awk '/^Mem:/{print $2}')
        MEM_GB=${MEM_GB:-8}
        JOBS=$(( MEM_GB * 2 / 3 ))
        [ "$JOBS" -lt 1 ] && JOBS=1
        [ "$JOBS" -gt "$(nproc)" ] && JOBS=$(nproc)
        echo "Compiling with -j$JOBS ($MEM_GB GB RAM, $(nproc) cores)"

        # MTK 串行编译:warp -> mt_wifi 先行,避免内核模块竞争
        make package/mtk/drivers/warp/compile -j1 || true
        make package/mtk/drivers/mt_wifi/compile -j1 || true

        make -j$JOBS || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Machine Information
      if: (!cancelled())
      run: |
        echo "======================="
        lscpu | grep -E "name|Core|Thread"
        echo "======================="
        df -h
        echo "======================="
        du -h --max-depth=1 /builder | sort -rh | head -10
        echo "======================="

    # ---------------------------------------------------------------
    # 打包发布
    # ---------------------------------------------------------------
    - name: Package Firmware
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        cp $OPENWRT_PATH/.config build.config
        mv -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages
        tar -zcf Packages.tar.gz packages
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "KERNEL=$(cat *.manifest | grep ^kernel | cut -d- -f2 | tr -d ' ')" >> $GITHUB_ENV
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Save Cached
      if: ${{ github.event.inputs.ccache == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@main
      with:
        path: /builder/.ccache
        key: ${{ env.CCACHE_KEY_PREFIX }}-${{ env.WRT_HASH }}

    - name: Upload Firmware To Artifact
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
          ### 📒 固件信息
          - 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 💝 源码分支: ${{ env.REPO_BRANCH }}
          - 🚀 内核版本: ${{ env.KERNEL }}
          - 🌐 默认地址: 10.0.0.1
          - 🔑 默认密码: password
          ### 🧊 固件版本
          - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
          - ${{ env.COMMIT_AUTHOR }}
          - ${{ env.COMMIT_DATE }}
          - ${{ env.COMMIT_MESSAGE }}
          - ${{ env.COMMIT_HASH }}
